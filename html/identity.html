<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>kt_idcard_ui</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    pointer-events: none; overflow: hidden;
  }

  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
    pointer-events: all; align-items: center; justify-content: center;
  }
  #overlay.visible { display: flex; }

  /* ── CARD BASE ── */
  .card {
    position: relative; width: 440px;
    background: #0d0f14;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    animation: cardIn 0.35s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes cardIn {
    from { opacity:0; transform: translateY(18px) scale(0.97); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, #1a6cff, #00d4aa);
  }

  /* ── HEADER ── */
  .card-header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 24px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .card-country { display:flex; align-items:center; gap:10px; }
  .flag { width:28px; height:20px; border-radius:3px; overflow:hidden; display:flex; flex-direction:column; flex-shrink:0; }
  .flag-b { flex:1; background:#002395; }
  .flag-w { flex:1; background:#fff; }
  .flag-r { flex:1; background:#ED2939; }
  .card-country-name { font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2.5px; color:rgba(255,255,255,0.45); }
  .card-type { font-family:'IBM Plex Mono',monospace; font-size:10px; color:rgba(255,255,255,0.25); letter-spacing:1px; }

  /* ── BODY IDENTITÉ ── */
  .card-body { display:flex; gap:20px; padding:20px 24px; }
  .card-photo {
    width:80px; height:96px; border-radius:6px;
    background:#1a1d24; border:1px solid rgba(255,255,255,0.08);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .card-photo svg { width:44px; height:44px; opacity:0.2; }
  .card-photo.male   .icon-m { display:block; } .card-photo.male   .icon-f { display:none; }
  .card-photo.female .icon-m { display:none;  } .card-photo.female .icon-f { display:block; }
  .icon-m, .icon-f { display:none; }
  .card-info { flex:1; display:flex; flex-direction:column; gap:12px; }
  .card-name { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; color:#fff; line-height:1; }
  .card-name .first { color:#1a6cff; font-size:20px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field { display:flex; flex-direction:column; gap:2px; }
  .field.full { grid-column: 1 / -1; }
  .field-label { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1.5px; color:rgba(255,255,255,0.28); text-transform:uppercase; }
  .field-value { font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); }

  /* ── BODY PERMIS ── */
  .license-list { padding: 16px 24px; display:flex; flex-direction:column; gap:8px; }
  .license-item {
    display:flex; align-items:center; gap:12px;
    padding: 10px 14px; border-radius:8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    transition: border-color 0.2s;
  }
  .license-item.valid   { border-color: rgba(0,212,170,0.3); }
  .license-item.invalid { border-color: rgba(255,60,60,0.2); opacity:0.55; }
  .license-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:14px; flex-shrink:0; }
  .license-item.valid   .license-icon { background:rgba(0,212,170,0.12); color:#00d4aa; }
  .license-item.invalid .license-icon { background:rgba(255,60,60,0.08); color:rgba(255,80,80,0.6); }
  .license-info { flex:1; }
  .license-name { font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); }
  .license-status { font-family:'IBM Plex Mono',monospace; font-size:10px; margin-top:2px; }
  .license-item.valid   .license-status { color:#00d4aa; }
  .license-item.invalid .license-status { color:rgba(255,80,80,0.6); }
  .license-badge { font-family:'IBM Plex Mono',monospace; font-size:9px; padding:3px 8px; border-radius:4px; letter-spacing:1px; }
  .license-item.valid   .license-badge { background:rgba(0,212,170,0.12); color:#00d4aa; }
  .license-item.invalid .license-badge { background:rgba(255,60,60,0.08); color:rgba(255,80,80,0.6); }

  /* ── MENU CONDUITE (fallback k_menu) ── */
  .driving-menu { padding:16px 24px; display:flex; flex-direction:column; gap:8px; }
  .driving-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 14px; border-radius:8px; cursor:pointer;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
    transition: background 0.15s, border-color 0.15s;
  }
  .driving-item:hover { background:rgba(26,108,255,0.1); border-color:rgba(26,108,255,0.3); }
  .driving-item.owned { opacity:0.4; cursor:default; pointer-events:none; }
  .driving-item i { width:28px; text-align:center; color:#1a6cff; font-size:14px; }
  .driving-label { font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); }
  .driving-owned { font-family:'IBM Plex Mono',monospace; font-size:9px; color:#00d4aa; margin-top:2px; }

  /* ── FOOTER ── */
  .card-footer {
    padding:12px 24px 16px;
    border-top:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:space-between;
  }
  .mrz { font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:1px; color:rgba(255,255,255,0.12); line-height:1.6; white-space:pre; }
  .card-id-chip { width:32px; height:24px; border-radius:4px; background:linear-gradient(135deg,#c8a84b,#e8c87a,#a07830); opacity:0.7; }

  /* ── SHOWN BY / CHECKED BY ── */
  .shown-by { text-align:center; padding:0 24px 14px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:0.5px; }
  .shown-by span { color:rgba(255,255,255,0.5); }
  .police-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(26,108,255,0.1); border:1px solid rgba(26,108,255,0.2); border-radius:4px; padding:2px 8px; }
  .police-badge i { color:#1a6cff; font-size:9px; }

  /* ── CLOSE HINT ── */
  .close-hint { position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); font-family:'IBM Plex Mono',monospace; font-size:10px; color:rgba(255,255,255,0.3); white-space:nowrap; }
</style>
</head>
<body>
<div id="overlay">
  <div style="position:relative">
    <div class="card" id="card">

      <!-- HEADER commun -->
      <div class="card-header">
        <div class="card-country">
          <div class="flag"><div class="flag-b"></div><div class="flag-w"></div><div class="flag-r"></div></div>
          <span class="card-country-name" id="card-country-name">République Française</span>
        </div>
        <span class="card-type" id="card-type-label">CARTE NATIONALE D'IDENTITÉ</span>
      </div>

      <!-- VUE : CARTE D'IDENTITÉ -->
      <div id="view-identity">
        <div class="card-body">
          <div class="card-photo" id="photo">
            <svg class="icon-m" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <svg class="icon-f" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><path d="M12 17v4M10 19h4" stroke-linecap="round"/></svg>
          </div>
          <div class="card-info">
            <div class="card-name">
              <span id="field-lastname">NOM</span> <span class="first" id="field-firstname">Prénom</span>
            </div>
            <div class="fields">
              <div class="field"><span class="field-label">Date de naissance</span><span class="field-value" id="field-dob">—</span></div>
              <div class="field"><span class="field-label">Sexe</span><span class="field-value" id="field-gender">—</span></div>
              <div class="field full"><span class="field-label">Profession</span><span class="field-value" id="field-job">—</span></div>
              <div class="field full"><span class="field-label">Identifiant unique</span><span class="field-value" id="field-uid" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,0.5)">—</span></div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <div class="mrz" id="field-mrz"></div>
          <div class="card-id-chip"></div>
        </div>
      </div>

      <!-- VUE : PERMIS -->
      <div id="view-licenses" style="display:none">
        <div style="padding:16px 24px 8px">
          <div class="card-name" style="font-size:18px">
            <span id="lic-lastname">NOM</span> <span class="first" id="lic-firstname">Prénom</span>
          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,0.25);margin-top:4px" id="lic-uid">—</div>
        </div>
        <div class="license-list" id="license-list"></div>
      </div>

      <!-- VUE : MENU CONDUITE (fallback k_menu) -->
      <div id="view-driving" style="display:none">
        <div style="padding:16px 24px 8px">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;letter-spacing:1px">Choisissez votre permis</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,0.25);margin-top:4px">Auto-école officielle</div>
        </div>
        <div class="driving-menu" id="driving-menu"></div>
        <div style="padding:8px 24px 16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,0.2)">Cliquez sur un permis pour passer l'examen</div>
      </div>

      <!-- SHOWN BY -->
      <div class="shown-by" id="shown-by" style="display:none">
        <span id="shown-by-label">Présentée par</span> <span id="field-shownby" class="police-badge"><i class="fas fa-shield-halved"></i><span id="shownby-name">—</span></span>
      </div>

    </div>
    <div class="close-hint">Appuyez sur [E] pour fermer</div>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');

  function setView(name) {
    document.getElementById('view-identity').style.display = name === 'identity' ? '' : 'none';
    document.getElementById('view-licenses').style.display = name === 'licenses' ? '' : 'none';
    document.getElementById('view-driving').style.display  = name === 'driving'  ? '' : 'none';
  }

  function padMRZ(str, len) {
    return (str || '').toUpperCase().replace(/[^A-Z0-9]/g, '<').padEnd(len, '<');
  }

  // ── CARTE D'IDENTITÉ ──
  function showIdentity(data) {
    document.getElementById('card-type-label').textContent = data.is_police_check ? 'CONTRÔLE D\'IDENTITÉ' : 'CARTE NATIONALE D\'IDENTITÉ';
    document.getElementById('field-lastname').textContent  = (data.lastname  || '').toUpperCase();
    document.getElementById('field-firstname').textContent = data.firstname  || '';
    document.getElementById('field-dob').textContent       = data.dateofbirth || '—';
    document.getElementById('field-uid').textContent       = data.unique_id  || '—';
    document.getElementById('field-job').textContent       = data.job_label  || data.job || 'Sans emploi';

    const isFemale = data.ped_model === 'mp_f_freemode_01';
    document.getElementById('field-gender').textContent = isFemale ? 'F' : 'M';
    document.getElementById('photo').className = 'card-photo ' + (isFemale ? 'female' : 'male');

    const ln  = padMRZ(data.lastname, 13);
    const fn  = padMRZ(data.firstname, 12);
    const uid = padMRZ(data.unique_id, 9).slice(0, 9);
    document.getElementById('field-mrz').textContent = `IDFRAX${uid}<<<<<<\n${ln}<<${fn}`;

    const sb = document.getElementById('shown-by');
    if (data.shown_by) {
      document.getElementById('shown-by-label').textContent = data.is_police_check ? 'Contrôlé par' : 'Présentée par';
      document.getElementById('shownby-name').textContent   = data.shown_by;
      sb.style.display = 'block';
    } else {
      sb.style.display = 'none';
    }

    setView('identity');
    overlay.classList.add('visible');
  }

  // ── PERMIS ──
  function showLicenses(data) {
    document.getElementById('card-type-label').textContent = data.checked_by ? 'CONTRÔLE PERMIS' : 'PERMIS DE CONDUIRE';
    document.getElementById('lic-lastname').textContent    = (data.lastname  || '').toUpperCase();
    document.getElementById('lic-firstname').textContent   = data.firstname  || '';
    document.getElementById('lic-uid').textContent         = data.unique_id  || '—';

    const list = document.getElementById('license-list');
    list.innerHTML = '';
    (data.licenses || []).forEach(lic => {
      const item = document.createElement('div');
      item.className = 'license-item ' + (lic.valid ? 'valid' : 'invalid');
      item.innerHTML = `
        <div class="license-icon"><i class="${lic.icon || 'fas fa-id-card'}"></i></div>
        <div class="license-info">
          <div class="license-name">${lic.label}</div>
          <div class="license-status">${lic.valid ? 'Valide' : 'Non obtenu'}</div>
        </div>
        <span class="license-badge">${lic.valid ? 'VALIDE' : 'ABSENT'}</span>
      `;
      list.appendChild(item);
    });

    const sb = document.getElementById('shown-by');
    if (data.checked_by) {
      document.getElementById('shown-by-label').textContent = 'Contrôlé par';
      document.getElementById('shownby-name').textContent   = data.checked_by;
      sb.style.display = 'block';
    } else {
      sb.style.display = 'none';
    }

    setView('licenses');
    overlay.classList.add('visible');
  }

  // ── MENU CONDUITE (fallback) ──
  function showDrivingMenu(data) {
    document.getElementById('card-type-label').textContent = 'AUTO-ÉCOLE';
    const menu = document.getElementById('driving-menu');
    menu.innerHTML = '';
    (data.licenses || []).forEach(lic => {
      const item = document.createElement('div');
      item.className = 'driving-item' + (lic.owned ? ' owned' : '');
      item.innerHTML = `
        <i class="${lic.icon || 'fas fa-car'}"></i>
        <div>
          <div class="driving-label">${lic.label}</div>
          ${lic.owned ? '<div class="driving-owned">✓ Déjà obtenu</div>' : ''}
        </div>
      `;
      if (!lic.owned) {
        item.onclick = () => {
          fetch(`https://${GetParentResourceName()}/idcard:selectLicense`, {
            method: 'POST',
            body: JSON.stringify({ type: lic.type })
          });
        };
      }
      menu.appendChild(item);
    });

    document.getElementById('shown-by').style.display = 'none';
    setView('driving');
    overlay.classList.add('visible');
  }

  function hide() {
    overlay.classList.remove('visible');
  }

  window.addEventListener('message', function(e) {
    const d = e.data;
    if      (d.action === 'showIdentity')    showIdentity(d);
    else if (d.action === 'showLicenses')    showLicenses(d);
    else if (d.action === 'showDrivingMenu') showDrivingMenu(d);
    else if (d.action === 'hideIdentity')    hide();
  });

  document.addEventListener('keydown', function(e) {
    if ((e.key === 'e' || e.key === 'E') && overlay.classList.contains('visible')) {
      hide();
      fetch(`https://${GetParentResourceName()}/idcard:close`, { method: 'POST', body: JSON.stringify({}) });
    }
  });

  function GetParentResourceName() {
    return window.location.hostname;
  }
</script>
</body>
</html>
